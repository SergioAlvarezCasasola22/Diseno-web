<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarea 8 - Formulario</title>
    <link rel="stylesheet" href="styles/08_styles.css">
</head>
<body>

    <form class="formulario">

        <div class="campo">
            <label>First Name</label>
            <input type="text" placeholder="Enter your first name here">
        </div>

        <div class="campo">
            <label>Last Name</label>
            <input type="text" placeholder="Enter your last name here">
        </div>

        <div class="campo">
            <label>Email</label>
            <input type="email" placeholder="Enter your email here">
        </div>

        <div class="campo">
            <label>Phone</label>
            <input type="tel" placeholder="Enter your phone here">
        </div>

        <div class="campo campo-mensaje">
            <label>Message</label>
            <textarea placeholder="Enter your message here"></textarea>
        </div>

        <div class="campo">
            <label>Age</label>
            <div class="edades">
                <label class="opcion"><input type="checkbox"> 20-29</label>
                <label class="opcion"><input type="checkbox"> 30-39</label>
                <label class="opcion"><input type="checkbox"> 40-49</label>
                <label class="opcion"><input type="checkbox"> 50-59</label>
                <label class="opcion"><input type="checkbox"> &gt;60</label>
            </div>
        </div>

    </form>

</body>
</html>
